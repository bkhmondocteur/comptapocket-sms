<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaPocket SMS - Générateur de Licence</title>
    <link rel="icon" type="image/png" href="app/src/main/res/drawable/app_logo.png">
    <style>
        :root {
            --primary: #1565c0;
            --primary-dark: #0d47a1;
            --gold: #d4af37;
            --gold-light: #f5d77f;
            --bg-gradient: linear-gradient(135deg, #070d1e 0%, #0d1b2a 50%, #1b263b 100%);
            --card-bg: #111d33;
            --card-border: rgba(212, 175, 55, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .keygen-card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(212, 175, 55, 0.2);
            padding: 36px 30px;
            text-align: center;
            position: relative;
        }

        .header-logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            border-radius: 50%;
            border: 2px solid var(--gold-light);
            box-shadow: 0 0 25px rgba(245, 215, 127, 0.35);
            background: #0b1329;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--gold-light);
            margin-bottom: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius);
            color: var(--text-main);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--gold-light);
            box-shadow: 0 0 15px rgba(245, 215, 127, 0.25);
            background: rgba(15, 23, 42, 1);
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
            border: 1px solid var(--gold-light);
            border-radius: var(--radius);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(13, 71, 161, 0.4);
            margin-top: 10px;
        }

        .btn-generate:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 71, 161, 0.6);
        }

        .result-box {
            margin-top: 28px;
            padding: 20px;
            background: rgba(10, 17, 34, 0.85);
            border: 1px dashed var(--gold);
            border-radius: var(--radius);
            display: none;
        }

        .key-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            font-weight: 800;
            color: var(--gold-light);
            letter-spacing: 2px;
            margin: 12px 0;
            word-break: break-all;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--gold);
            color: #070d1e;
        }
    </style>
</head>
<body>

    <div class="keygen-card">
        <div class="header-logo">
            <img src="app/src/main/res/drawable/app_logo.png" alt="ComptaPocket SMS">
        </div>
        <h1>ComptaPocket SMS</h1>
        <div class="subtitle">Générateur de Clé d'Activation Cabinet Comptable</div>

        <div class="form-group">
            <label for="cabinet-name">Nom du Bureau Comptable / Expert :</label>
            <input type="text" id="cabinet-name" placeholder="Ex: CABINET BEN KHELIL & ASSOCIES" autofocus>
        </div>

        <button class="btn-generate" onclick="generateKey()">Générer la Clé de Licence</button>

        <div class="result-box" id="result-box">
            <label>Clé d'activation unique :</label>
            <div class="key-display" id="key-output">XXXX-XXXX-XXXX-XXXX</div>
            <button class="copy-btn" id="copy-btn" onclick="copyKey()">📋 Copier la Clé</button>
        </div>
    </div>

    <!-- Script MD5 et génération -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        const SALT_COMPTA = "COMPTA_SEC_2026";

        function generateKey() {
            const input = document.getElementById('cabinet-name');
            const name = input.value.trim().toUpperCase();

            if (!name) {
                alert("Veuillez saisir le nom du cabinet comptable.");
                input.focus();
                return;
            }

            const rawString = name + SALT_COMPTA;
            const hash = CryptoJS.MD5(rawString).toString(CryptoJS.enc.Hex).toUpperCase();
            const keyBase = hash.substring(0, 16);
            const formatted = `${keyBase.substring(0, 4)}-${keyBase.substring(4, 8)}-${keyBase.substring(8, 12)}-${keyBase.substring(12, 16)}`;

            document.getElementById('key-output').innerText = formatted;
            document.getElementById('result-box').style.display = 'block';
        }

        function copyKey() {
            const key = document.getElementById('key-output').innerText;
            navigator.clipboard.writeText(key).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "✅ Clé Copiée !";
                setTimeout(() => { btn.innerText = "📋 Copier la Clé"; }, 2500);
            });
        }
    </script>
</body>
</html>
